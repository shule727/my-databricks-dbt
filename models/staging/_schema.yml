version: 2

sources:
  - name: raw
    catalog: workspace
    schema: raw
    tables:
      - name: orders
      - name: companies

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
  - name: stg_customers
    columns:
      - name: id
        data_tests:
          - not_null
          - unique
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      - name: company_id
        data_tests:
          - not_null
      - name: email
        data_tests:
          - not_null
          - unique
      - name: created_at
        data_tests:
          - not_null
  - name: stg_companies
    columns:
      - name: id
        data_tests:
          - not_null
          - unique
      - name: company_name
        data_tests:
          - not_null
      - name: industry
      - name: country
      - name: created_at
        data_tests:
          - not_null
